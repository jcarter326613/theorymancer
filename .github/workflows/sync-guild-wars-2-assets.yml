name: Sync Guild Wars 2 Assets

on:
    workflow_dispatch:
        inputs:
            environment:
                description: Target asset environment
                required: true
                type: choice
                options:
                    - development
                    - production

permissions:
    contents: read
    id-token: write

jobs:
    sync:
        name: Sync ${{ inputs.environment }} assets
        runs-on: ubuntu-latest
        environment: ${{ inputs.environment }}
        env:
            ENVIRONMENT: ${{ inputs.environment }}
            GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        steps:
            - uses: actions/checkout@v4

            - uses: google-github-actions/auth@v2
              with:
                  workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
                  service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

            - uses: google-github-actions/setup-gcloud@v2

            - name: Sync manifest icons
              shell: pwsh
              run: >-
                  ./apps/guild-wars-2/assets/sync-icons.ps1
                  -Bucket "$($env:GCP_PROJECT_ID)-theorymancer-$($env:ENVIRONMENT)-game-assets"
