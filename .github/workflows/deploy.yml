name: Deploy

on:
    push:
        branches:
            - main
    workflow_dispatch:
        inputs:
            environment:
                description: Deployment environment
                required: true
                type: choice
                options:
                    - development
                    - production

permissions:
    contents: read
    id-token: write

concurrency:
    group: theorymancer-infrastructure
    cancel-in-progress: false

jobs:
    resolve-development-web-origin:
        name: Resolve development web origin
        runs-on: ubuntu-latest
        environment: development
        outputs:
            web_origin: ${{ steps.resolve.outputs.web_origin }}
        env:
            TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        steps:
            - uses: actions/checkout@v4

            - uses: google-github-actions/auth@v2
              with:
                  workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
                  service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

            - uses: hashicorp/setup-terraform@v3
              with:
                  terraform_wrapper: false

            - name: Initialize Terraform
              working-directory: infrastructure/environments/development
              run: >-
                  terraform init -input=false
                  -backend-config="bucket=${TF_STATE_BUCKET}"
                  -backend-config=backend.hcl

            - id: resolve
              name: Read deployed web URL
              working-directory: infrastructure/environments/development
              run: |
                  web_origin="$(terraform output -raw web_url 2>/dev/null || true)"
                  echo "web_origin=$web_origin" >> "$GITHUB_OUTPUT"

    shared-plan:
        name: Plan shared infrastructure
        needs: resolve-development-web-origin
        runs-on: ubuntu-latest
        environment: development
        outputs:
            has_changes: ${{ steps.plan.outputs.has_changes }}
        env:
            GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
            GCP_REGION: ${{ vars.GCP_REGION }}
            TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
            DEVELOPMENT_WEB_ORIGIN: ${{ needs.resolve-development-web-origin.outputs.web_origin }}
        steps:
            - uses: actions/checkout@v4

            - uses: google-github-actions/auth@v2
              with:
                  workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
                  service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

            - uses: hashicorp/setup-terraform@v3
              with:
                  terraform_wrapper: false

            - name: Initialize Terraform
              working-directory: infrastructure/shared
              run: >-
                  terraform init -input=false
                  -backend-config="bucket=${TF_STATE_BUCKET}"
                  -backend-config=backend.hcl

            - id: plan
              name: Plan shared infrastructure
              working-directory: infrastructure/shared
              run: |
                  set +e
                  terraform plan -input=false -detailed-exitcode -out=tfplan \
                    -var="project_id=${GCP_PROJECT_ID}" \
                    -var="region=${GCP_REGION}" \
                    -var="development_web_origin=${DEVELOPMENT_WEB_ORIGIN}"
                  status=$?
                  if [ "$status" -eq 1 ]; then
                    exit 1
                  fi
                  echo "has_changes=$([ "$status" -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
                  if [ "$status" -eq 2 ]; then
                    terraform show -no-color tfplan | tee -a "$GITHUB_STEP_SUMMARY"
                  fi

            - name: Upload shared plan
              if: steps.plan.outputs.has_changes == 'true'
              uses: actions/upload-artifact@v4
              with:
                  name: shared-terraform-plan
                  path: infrastructure/shared/tfplan
                  if-no-files-found: error

    shared-apply:
        name: Apply shared infrastructure
        needs: shared-plan
        if: needs.shared-plan.outputs.has_changes == 'true'
        runs-on: ubuntu-latest
        environment: production
        env:
            TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        steps:
            - uses: actions/checkout@v4

            - uses: google-github-actions/auth@v2
              with:
                  workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
                  service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

            - uses: hashicorp/setup-terraform@v3
              with:
                  terraform_wrapper: false

            - name: Initialize Terraform
              working-directory: infrastructure/shared
              run: >-
                  terraform init -input=false
                  -backend-config="bucket=${TF_STATE_BUCKET}"
                  -backend-config=backend.hcl

            - name: Download reviewed shared plan
              uses: actions/download-artifact@v4
              with:
                  name: shared-terraform-plan
                  path: infrastructure/shared

            - name: Apply shared infrastructure
              working-directory: infrastructure/shared
              run: terraform apply -input=false -auto-approve tfplan

    deploy:
        name: Deploy ${{ inputs.environment || 'development' }}
        needs:
            - shared-plan
            - shared-apply
        if: >-
            always() && needs.shared-plan.result == 'success' &&
            (needs.shared-apply.result == 'success' || needs.shared-apply.result == 'skipped')
        runs-on: ubuntu-latest
        environment: ${{ inputs.environment || 'development' }}
        outputs:
            development_web_origin: ${{ steps.deployed-development-web-origin.outputs.web_origin }}
            initial_development_origin: ${{ steps.resolve-web-origin.outputs.initial_development_origin }}
        env:
            ENVIRONMENT: ${{ inputs.environment || 'development' }}
            GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
            GCP_REGION: ${{ vars.GCP_REGION }}
            TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
            IP_HASH_SECRET_VERSION: ${{ vars.IP_HASH_SECRET_VERSION || '1' }}
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Enable Corepack
              run: corepack enable

            - name: Test and build APIs
              run: |
                  pnpm install --frozen-lockfile
                  pnpm --filter @theorymancer/api test
                  pnpm --filter @theorymancer/api build
                  pnpm --filter @theorymancer/guild-wars-2-api test
                  pnpm --filter @theorymancer/guild-wars-2-api build

            - uses: google-github-actions/auth@v2
              with:
                  workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
                  service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

            - uses: google-github-actions/setup-gcloud@v2

            - name: Configure Artifact Registry authentication
              run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

            - name: Build and publish images
              env:
                  IMAGE_TAG: ${{ github.sha }}-${{ github.run_attempt }}-${{ inputs.environment || 'development' }}
              run: |
                  WEB_IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/theorymancer/web:${IMAGE_TAG}"
                  API_IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/theorymancer/api:${IMAGE_TAG}"
                  GUILD_WARS_2_API_IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/theorymancer/guild-wars-2-api:${IMAGE_TAG}"
                  docker build -f apps/web/Dockerfile -t "$WEB_IMAGE" .
                  docker build -f apps/api/Dockerfile -t "$API_IMAGE" .
                  docker build -f apps/guild-wars-2/api/Dockerfile -t "$GUILD_WARS_2_API_IMAGE" .
                  docker push "$WEB_IMAGE"
                  docker push "$API_IMAGE"
                  docker push "$GUILD_WARS_2_API_IMAGE"
                  printf 'WEB_IMAGE=%s\nAPI_IMAGE=%s\nGUILD_WARS_2_API_IMAGE=%s\n' "$WEB_IMAGE" "$API_IMAGE" "$GUILD_WARS_2_API_IMAGE" >> "$GITHUB_ENV"

            - uses: hashicorp/setup-terraform@v3
              with:
                  terraform_wrapper: false

            - name: Initialize Terraform
              working-directory: infrastructure/environments/${{ inputs.environment || 'development' }}
              run: >-
                  terraform init -input=false
                  -backend-config="bucket=${TF_STATE_BUCKET}"
                  -backend-config=backend.hcl

            - id: resolve-web-origin
              name: Resolve API web origin
              run: |
                  if [ "$ENVIRONMENT" = "development" ]; then
                    web_origin="${{ needs.resolve-development-web-origin.outputs.web_origin }}"
                    if [ -z "$web_origin" ]; then
                      web_origin="https://bootstrap.invalid"
                      echo "initial_development_origin=true" >> "$GITHUB_OUTPUT"
                    else
                      echo "initial_development_origin=false" >> "$GITHUB_OUTPUT"
                    fi
                  else
                    web_origin="${{ vars.WEB_ORIGIN }}"
                    echo "initial_development_origin=false" >> "$GITHUB_OUTPUT"
                  fi
                  echo "WEB_ORIGIN=$web_origin" >> "$GITHUB_ENV"

            - name: Ensure IP-hash secret version
              working-directory: infrastructure/environments/${{ inputs.environment || 'development' }}
              run: |
                  set -euo pipefail
                  secret_id="theorymancer-${ENVIRONMENT}-ip-hash"

                  if ! gcloud secrets describe "$secret_id" --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
                    terraform apply -input=false -auto-approve \
                      -target=google_secret_manager_secret.ip_hash \
                      -var="project_id=${GCP_PROJECT_ID}" \
                      -var="region=${GCP_REGION}" \
                      -var="terraform_state_bucket=${TF_STATE_BUCKET}" \
                      -var="web_origin=${WEB_ORIGIN}" \
                      -var="ip_hash_secret_version=${IP_HASH_SECRET_VERSION}" \
                      -var="web_image=${WEB_IMAGE}" \
                      -var="api_image=${API_IMAGE}" \
                      -var="guild_wars_2_api_image=${GUILD_WARS_2_API_IMAGE}"
                  fi

                  version_state="$(gcloud secrets versions describe "$IP_HASH_SECRET_VERSION" \
                    --secret="$secret_id" --project="$GCP_PROJECT_ID" --format='value(state)' 2>/dev/null || true)"
                  if [ "$version_state" = "ENABLED" ]; then
                    exit 0
                  fi
                  if [ -n "$version_state" ]; then
                    echo "The configured IP_HASH_SECRET_VERSION ($IP_HASH_SECRET_VERSION) is not enabled for $secret_id." >&2
                    exit 1
                  fi

                  latest_version="$(gcloud secrets versions list "$secret_id" --project="$GCP_PROJECT_ID" \
                    --sort-by='~createTime' --limit=1 --format='value(name)')"
                  if [ -n "$latest_version" ]; then
                    latest_version_number="${latest_version##*/}"
                    expected_version="$((latest_version_number + 1))"
                    if [ "$IP_HASH_SECRET_VERSION" != "$expected_version" ]; then
                      echo "The configured IP_HASH_SECRET_VERSION ($IP_HASH_SECRET_VERSION) does not exist for $secret_id and is not the next version ($expected_version)." >&2
                      exit 1
                    fi
                  fi

                  # Send the generated value directly to Secret Manager; it never enters Terraform state.
                  openssl rand -base64 32 | gcloud secrets versions add "$secret_id" \
                    --project="$GCP_PROJECT_ID" --data-file=-
                  gcloud secrets versions describe "$IP_HASH_SECRET_VERSION" \
                    --secret="$secret_id" --project="$GCP_PROJECT_ID" >/dev/null

            - name: Apply infrastructure
              working-directory: infrastructure/environments/${{ inputs.environment || 'development' }}
              run: >-
                  terraform apply -input=false -auto-approve
                  -var="project_id=${GCP_PROJECT_ID}"
                  -var="region=${GCP_REGION}"
                  -var="terraform_state_bucket=${TF_STATE_BUCKET}"
                  -var="web_origin=${WEB_ORIGIN}"
                  -var="ip_hash_secret_version=${IP_HASH_SECRET_VERSION}"
                  -var="web_image=${WEB_IMAGE}"
                  -var="api_image=${API_IMAGE}"
                  -var="guild_wars_2_api_image=${GUILD_WARS_2_API_IMAGE}"

            - id: deployed-development-web-origin
              name: Read deployed development web URL
              if: env.ENVIRONMENT == 'development'
              working-directory: infrastructure/environments/development
              run: echo "web_origin=$(terraform output -raw web_url)" >> "$GITHUB_OUTPUT"

            - name: Finalize initial development API origin
              if: steps.resolve-web-origin.outputs.initial_development_origin == 'true'
              working-directory: infrastructure/environments/development
              run: |
                  set -euo pipefail
                  web_origin="${{ steps.deployed-development-web-origin.outputs.web_origin }}"
                  if [ -z "$web_origin" ]; then
                    echo "The initial development deployment did not produce a web URL." >&2
                    exit 1
                  fi
                  terraform apply -input=false -auto-approve \
                    -var="project_id=${GCP_PROJECT_ID}" \
                    -var="region=${GCP_REGION}" \
                    -var="terraform_state_bucket=${TF_STATE_BUCKET}" \
                    -var="web_origin=${web_origin}" \
                    -var="ip_hash_secret_version=${IP_HASH_SECRET_VERSION}" \
                    -var="web_image=${WEB_IMAGE}" \
                    -var="api_image=${API_IMAGE}" \
                    -var="guild_wars_2_api_image=${GUILD_WARS_2_API_IMAGE}"

            - name: Smoke test deployed services
              working-directory: infrastructure/environments/${{ inputs.environment || 'development' }}
              run: |
                  WEB_URL="$(terraform output -raw web_url)"
                  API_URL="$(terraform output -raw api_url)"
                  GUILD_WARS_2_API_URL="$(terraform output -raw guild_wars_2_api_url)"
                  curl --fail --retry 5 --retry-delay 3 "$WEB_URL"
                  curl --fail --retry 5 --retry-delay 3 "$WEB_URL/config.js"
                  curl --fail --retry 5 --retry-delay 3 "$API_URL/health"
                  curl --fail --retry 5 --retry-delay 3 "$API_URL/.well-known/jwks.json"
                  curl --fail --retry 5 --retry-delay 3 "$GUILD_WARS_2_API_URL/health"

    shared-development-origin-plan:
        name: Plan discovered development origin
        needs: deploy
        if: >-
            always() && needs.deploy.result == 'success' &&
            needs.deploy.outputs.initial_development_origin == 'true'
        runs-on: ubuntu-latest
        environment: development
        outputs:
            has_changes: ${{ steps.plan.outputs.has_changes }}
        env:
            GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
            GCP_REGION: ${{ vars.GCP_REGION }}
            TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
            DEVELOPMENT_WEB_ORIGIN: ${{ needs.deploy.outputs.development_web_origin }}
        steps:
            - uses: actions/checkout@v4

            - uses: google-github-actions/auth@v2
              with:
                  workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
                  service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

            - uses: hashicorp/setup-terraform@v3
              with:
                  terraform_wrapper: false

            - name: Initialize Terraform
              working-directory: infrastructure/shared
              run: >-
                  terraform init -input=false
                  -backend-config="bucket=${TF_STATE_BUCKET}"
                  -backend-config=backend.hcl

            - id: plan
              name: Plan shared infrastructure
              working-directory: infrastructure/shared
              run: |
                  set +e
                  terraform plan -input=false -detailed-exitcode -out=tfplan \
                    -var="project_id=${GCP_PROJECT_ID}" \
                    -var="region=${GCP_REGION}" \
                    -var="development_web_origin=${DEVELOPMENT_WEB_ORIGIN}"
                  status=$?
                  if [ "$status" -eq 1 ]; then
                    exit 1
                  fi
                  echo "has_changes=$([ "$status" -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
                  if [ "$status" -eq 2 ]; then
                    terraform show -no-color tfplan | tee -a "$GITHUB_STEP_SUMMARY"
                  fi

            - name: Upload shared plan
              if: steps.plan.outputs.has_changes == 'true'
              uses: actions/upload-artifact@v4
              with:
                  name: discovered-development-origin-plan
                  path: infrastructure/shared/tfplan
                  if-no-files-found: error

    shared-development-origin-apply:
        name: Apply discovered development origin
        needs: shared-development-origin-plan
        if: >-
            always() && needs.shared-development-origin-plan.result == 'success' &&
            needs.shared-development-origin-plan.outputs.has_changes == 'true'
        runs-on: ubuntu-latest
        environment: production
        env:
            TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        steps:
            - uses: actions/checkout@v4

            - uses: google-github-actions/auth@v2
              with:
                  workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
                  service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

            - uses: hashicorp/setup-terraform@v3
              with:
                  terraform_wrapper: false

            - name: Initialize Terraform
              working-directory: infrastructure/shared
              run: >-
                  terraform init -input=false
                  -backend-config="bucket=${TF_STATE_BUCKET}"
                  -backend-config=backend.hcl

            - name: Download reviewed shared plan
              uses: actions/download-artifact@v4
              with:
                  name: discovered-development-origin-plan
                  path: infrastructure/shared

            - name: Apply shared infrastructure
              working-directory: infrastructure/shared
              run: terraform apply -input=false -auto-approve tfplan
